<!"index.html"DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Diamond — Share Your Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cc80;
      --gold-dim: #8a6d2e;
      --black: #0a0a0a;
      --deep: #111008;
      --surface: #161410;
      --border: rgba(201,168,76,0.25);
      --text: #e8e0cc;
      --muted: rgba(232,224,204,0.5);
    }

    html, body {
      min-height: 100%;
      background: var(--deep);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }

    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(201,168,76,0.06) 0%, transparent 60%),
        var(--deep);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* Diamond decoration */
    .diamond-top {
      width: 12px; height: 12px;
      background: var(--gold);
      transform: rotate(45deg);
      margin-bottom: 32px;
      box-shadow: 0 0 20px rgba(201,168,76,0.6);
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--gold-light);
      line-height: 1.1;
      text-transform: uppercase;
    }

    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.75rem, 3vw, 0.9rem);
      letter-spacing: 0.35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px auto;
      width: fit-content;
    }
    .divider-line {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .divider-line.right {
      background: linear-gradient(90deg, var(--gold), transparent);
    }
    .divider-diamond {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: var(--muted);
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 0.04em;
    }

    /* Stars */
    .stars-section {
      text-align: center;
      margin-bottom: 36px;
    }
    .stars-label {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .star {
      font-size: 2rem;
      cursor: pointer;
      color: rgba(201,168,76,0.2);
      transition: color 0.2s, transform 0.15s;
      user-select: none;
    }
    .star:hover, .star.active {
      color: var(--gold);
    }
    .star:hover {
      transform: scale(1.15);
    }

    /* Form card */
    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 40px 36px;
      backdrop-filter: blur(10px);
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: linear-gradient(135deg, rgba(201,168,76,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Corner accents */
    .corner {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--gold);
      border-style: solid;
    }
    .corner.tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .corner.tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    input, textarea, select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 1px;
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 0.88rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(232,224,204,0.25);
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(201,168,76,0.6);
      background: rgba(201,168,76,0.04);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.7;
    }
    select option {
      background: var(--surface);
      color: var(--text);
    }

    .submit-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 16px 24px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .submit-btn:hover::before { opacity: 1; }
    .submit-btn:hover {
      box-shadow: 0 0 30px rgba(201,168,76,0.2), inset 0 0 20px rgba(201,168,76,0.05);
    }
    .submit-btn:active {
      transform: scale(0.99);
    }

    /* Success state */
    .success {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .success.show { display: block; }
    .success-diamond {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      transform: rotate(45deg);
      margin: 0 auto 28px;
      box-shadow: 0 0 40px rgba(201,168,76,0.4);
    }
    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--gold-light);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .success-text {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.8;
      letter-spacing: 0.06em;
    }

    .form-inner { transition: opacity 0.4s; }
    .form-inner.hidden { opacity: 0; pointer-events: none; }

    footer {
      margin-top: 48px;
      text-align: center;
    }
    .footer-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: rgba(201,168,76,0.3);
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <div class="diamond-top"></div>

  <header>
    <div class="brand-name">Royal Diamond</div>
    <div class="brand-sub">Nail &amp; Beauty Salon</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line right"></div>
    </div>
  </header>

  <p class="tagline">Your experience means everything to us.<br>We would love to hear from you.</p>

  <!-- Stars rating -->
  <div class="stars-section">
    <div class="stars-label">Rate your visit</div>
    <div class="stars" id="stars">
      <span class="star" data-val="1">◆</span>
      <span class="star" data-val="2">◆</span>
      <span class="star" data-val="3">◆</span>
      <span class="star" data-val="4">◆</span>
      <span class="star" data-val="5">◆</span>
    </div>
  </div>

  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Success message -->
    <div class="success" id="success">
      <div class="success-diamond"></div>
      <div class="success-title">Thank You</div>
      <p class="success-text">Your feedback has been received.<br>We are grateful for your trust<br>and look forward to welcoming you again.</p>
    </div>

    <!-- Form -->
    <form class="form-inner" id="feedbackForm" name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="feedback" />
      <input type="hidden" name="rating" id="ratingInput" value="" />
      <p style="display:none"><input name="bot-field" /></p>

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Ayşe Kaya" />
      </div>

      <div class="form-group">
        <label for="service">Service Received</label>
        <select id="service" name="service">
          <option value="" disabled selected>Select a service…</option>
          <option>Nail Art</option>
          <option>Manicure</option>
          <option>Pedicure</option>
          <option>Gel Nails</option>
          <option>Acrylic Nails</option>
          <option>Eyebrow / Lash</option>
          <option>Facial Treatment</option>
          <option>Hair Removal</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comment">Your Comment</label>
        <textarea id="comment" name="comment" placeholder="Tell us about your experience…" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>
  </div>

  <footer>
    <div class="footer-brand">Royal Diamond · Nail &amp; Beauty</div>
  </footer>

  <script>
    // Star rating
    let selectedRating = 0;
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('ratingInput');

    stars.forEach(star => {
      star.addEventListener('mouseover', () => {
        const val = +star.dataset.val;
        stars.forEach(s => s.classList.toggle('active', +s.dataset.val <= val));
      });
      star.addEventListener('mouseleave', () => {
        stars.forEach(s => s.classList.toggle('active', +s.dataset.val <= selectedRating));
      });
      star.addEventListener('click', () => {
        selectedRating = +star.dataset.val;
        ratingInput.value = selectedRating + ' / 5';
        stars.forEach(s => s.classList.toggle('active', +s.dataset.val <= selectedRating));
      });
    });

    // Form submission
    const form = document.getElementById('feedbackForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(data).toString() });
      } catch (_) {}
      form.classList.add('hidden');
      document.getElementById('success').classList.add('show');
    });
  </script>
</body>
</html>
